<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sports Hub – Contact</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="logo">Sports Hub</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="game.html">Game</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main class="contact-page">
    <h1 class="page-title">Contact Us</h1>
    <p class="section-subtitle">Have feedback or questions? We would love to hear from you!</p>

    <div class="form-container">
      <div class="form-card">

        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" placeholder="Enter your full name" />
          <span class="error-msg" id="name-error">Name cannot be empty</span>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="text" id="email" placeholder="Enter your email" />
          <span class="error-msg" id="email-error">Email must contain @</span>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="Write your message here..."></textarea>
          <span class="error-msg" id="message-error">Message cannot be empty</span>
        </div>

        <button class="btn submit-btn" onclick="validateForm()">Submit</button>

        <div class="form-result" id="form-result"></div>

      </div>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <p>© 2025 Sports Hub — All Rights Reserved</p>
      <div class="social-links">
        <a href="https://www.facebook.com" target="_blank">Facebook</a>
        <a href="https://www.instagram.com" target="_blank">Instagram</a>
        <a href="https://www.twitter.com" target="_blank">Twitter</a>
      </div>
    </div>
  </footer>

  <script src="js/contact.js"></script>
</body>
</html>
